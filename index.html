<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drum Viz</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
  svg { width: 100%; height: 100%; display: block; }

  .piece .base { fill: rgba(18, 20, 28, 0.72); stroke: color-mix(in srgb, var(--c) 45%, rgba(255,255,255,0.15)); stroke-width: 3; }
  .piece.cymbal .base { fill: rgba(40, 32, 12, 0.6); stroke: rgba(255, 214, 120, 0.35); }
  .piece .glow { opacity: 0; }
  .piece .rim { fill: none; stroke-width: 9; opacity: 0; }
  .piece .pop { transform-box: fill-box; transform-origin: center; }
  .label { fill: rgba(255, 255, 255, 0.55); font-size: 15px; font-weight: 600; letter-spacing: 0.08em;
           text-anchor: middle; text-transform: uppercase; paint-order: stroke; stroke: rgba(0,0,0,0.6); stroke-width: 3px; }
  .hide-labels .label { display: none; }
  .cymbal-lines { fill: none; stroke: rgba(255, 214, 120, 0.18); stroke-width: 1.5; }

  #status { position: fixed; left: 0; right: 0; top: 4px; text-align: center; font-size: 13px;
            color: rgba(255, 255, 255, 0.5); text-shadow: 0 1px 2px #000; }

  /* Stats strip: rolling APM + per-piece session counts */
  .with-stats svg { height: calc(100% - 96px); }
  #stats { position: fixed; left: 14px; right: 14px; bottom: 8px; height: 80px; box-sizing: border-box;
           display: flex; align-items: center; gap: 22px; padding: 0 20px; border-radius: 16px;
           background: rgba(14, 16, 22, 0.66); border: 1px solid rgba(255, 255, 255, 0.08);
           color: #fff; font-variant-numeric: tabular-nums; }
  #stats[hidden] { display: none; }
  .apm { display: flex; flex-direction: column; min-width: 128px; }
  .apm-value { font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .apm-value small { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; margin-left: 6px; color: rgba(255,255,255,0.6); }
  .apm-sub { font-size: 12px; color: rgba(255, 255, 255, 0.55); margin-top: 5px; }
  .apm-sub b { color: rgba(255, 255, 255, 0.85); font-weight: 700; }
  #counts { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px 14px; }
  .count { display: flex; align-items: center; gap: 7px; font-size: 13px; color: rgba(255, 255, 255, 0.6); white-space: nowrap; }
  .count i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .count b { margin-left: auto; color: #fff; font-weight: 700; }
  .count.total b { color: #ffcf5a; }
</style>
</head>
<body>
<!-- Top-down kit, drummer's view (kick at the bottom). -->
<svg viewBox="0 0 800 500" id="kit">
  <defs>
    <radialGradient id="g-drum"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.55" stop-color="var(--c)" stop-opacity="0.9"/><stop offset="1" stop-color="var(--c)" stop-opacity="0.35"/></radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
</svg>
<div id="status"></div>
<div id="stats" hidden>
  <div class="apm">
    <div class="apm-value"><span id="apm">0</span><small>APM</small></div>
    <div class="apm-sub">peak <b id="peak">0</b> · <span id="clock">0:00</span></div>
  </div>
  <div id="counts"></div>
</div>

<script>
// ---- Kit layout + note map (Alesis Nitro Max defaults; GM-compatible) ----
const PIECES = [
  // id,      label,     x,   y,   r,  color,     cymbal
  ["crash",  "Crash",   205, 105, 78, "#ffcf5a", true],
  ["ride",   "Ride",    655, 150, 92, "#ffcf5a", true],
  ["hihat",  "Hi-hat",  105, 255, 64, "#ffe08a", true],
  ["tom1",   "Tom 1",   325, 195, 50, "#5ad1ff"],
  ["tom2",   "Tom 2",   480, 195, 54, "#7a8cff"],
  ["tom3",   "Floor",   600, 330, 66, "#b77aff"],
  ["snare",  "Snare",   240, 335, 60, "#ff5a7a"],
  ["kick",   "Kick",    415, 370, 84, "#ff8a3d"],
  ["hhpedal","HH Pedal",105, 410, 26, "#ffe08a"],
];

// note -> [piece, part]   part: "head" | "rim" | "bell" | "half" | "open"
const NOTES = {
  35: ["kick", "head"], 36: ["kick", "head"],
  38: ["snare", "head"], 37: ["snare", "rim"], 40: ["snare", "rim"],
  48: ["tom1", "head"], 50: ["tom1", "rim"],
  45: ["tom2", "head"], 47: ["tom2", "rim"],
  43: ["tom3", "head"], 58: ["tom3", "rim"], 41: ["tom3", "head"],
  42: ["hihat", "head"], 22: ["hihat", "rim"], 46: ["hihat", "open"], 26: ["hihat", "open"],
  44: ["hhpedal", "head"], 21: ["hhpedal", "head"],          // 21 = foot splash
  23: ["hihat", "half"],                                    // half-open
  49: ["crash", "head"], 55: ["crash", "rim"], 57: ["crash", "head"], 52: ["crash", "head"],
  51: ["ride", "head"], 59: ["ride", "rim"], 53: ["ride", "bell"],
};

const params = new URLSearchParams(location.search);
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("kit");
const statusEl = document.getElementById("status");
if (params.get("labels") === "0") document.body.classList.add("hide-labels");
const FADE_MS = Number(params.get("fade") || 280);

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent && parent.appendChild(n);
  return n;
}

const parts = {};  // id -> {glow, bloom, rim, bell, pop}
for (const [id, label, x, y, r, color, cymbal] of PIECES) {
  const g = el("g", { class: "piece" + (cymbal ? " cymbal" : ""), style: `--c:${color}` }, svg);
  const pop = el("g", { class: "pop" }, g);
  if (id === "hhpedal") {
    el("rect", { class: "base", x: x - 22, y: y - 34, width: 44, height: 68, rx: 10 }, pop);
    const glow = el("rect", { class: "glow", x: x - 22, y: y - 34, width: 44, height: 68, rx: 10, fill: color }, pop);
    parts[id] = { glow, bloom: null, rim: null, bell: null, pop };
  } else {
    const bloom = el("circle", { class: "glow", cx: x, cy: y, r: r * 1.05, fill: color, filter: "url(#bloom)" }, pop);
    el("circle", { class: "base", cx: x, cy: y, r }, pop);
    if (cymbal) for (const f of [0.75, 0.5]) el("circle", { class: "cymbal-lines", cx: x, cy: y, r: r * f }, pop);
    const glow = el("circle", { class: "glow", cx: x, cy: y, r: r - 2, fill: "url(#g-drum)" }, pop);
    const rim = el("circle", { class: "rim", cx: x, cy: y, r: r - 3, stroke: color }, pop);
    const bell = id === "ride" ? el("circle", { class: "glow", cx: x, cy: y, r: r * 0.24, fill: "#fff" }, pop) : null;
    if (id === "ride") el("circle", { class: "cymbal-lines", cx: x, cy: y, r: r * 0.24 }, pop);
    parts[id] = { glow, bloom, rim, bell, pop };
  }
  el("text", { class: "label", x, y: y + (id === "hhpedal" ? 52 : r + 22) }, g).textContent = label;
}

// Restart a fade on an element: jump to `peak` opacity, then ease to 0.
function flash(node, peak, ms = FADE_MS) {
  if (!node) return;
  node.getAnimations().forEach(a => a.cancel());
  node.animate([{ opacity: peak }, { opacity: 0 }], { duration: ms, easing: "cubic-bezier(.2,.7,.3,1)" });
}

function hit(note, vel) {
  const m = NOTES[note];
  if (!m) { console.log("unmapped note", note, vel); return; }
  const [id, part] = m;
  const p = parts[id];
  recordHit(id);
  const v = Math.max(0.3, Math.min(1, Math.sqrt(vel / 100)));   // sqrt curve: low-sensitivity pads still flash
  if (part === "rim") { flash(p.rim, v); flash(p.glow, v * 0.45); }
  else if (part === "bell") { flash(p.bell, v); flash(p.glow, v * 0.5, FADE_MS * 1.6); }
  else flash(p.glow, v, ["crash", "ride"].includes(id) || part === "open" ? FADE_MS * 1.8 : FADE_MS);
  if (part === "open") flash(p.rim, v, FADE_MS * 1.8);
  if (part === "half") flash(p.rim, v * 0.5, FADE_MS * 1.3);
  flash(p.bloom, v * 0.8, FADE_MS * 1.3);
  p.pop.getAnimations().forEach(a => a.cancel());
  p.pop.animate([{ transform: `scale(${1 + 0.06 * v})` }, { transform: "scale(1)" }],
                { duration: 160, easing: "ease-out" });
}

// ---- Session stats: rolling APM (hits/min) + per-piece counts ----
// A session starts at the first hit; refreshing the browser source resets it.
const STATS = params.get("stats") !== "0";
const APM_WINDOW_S = Number(params.get("window") || 5);
const counts = {}, countEls = {};
const recent = [];   // hit timestamps inside the APM window
let sessionStart = null, peakApm = 0, total = 0;

if (STATS) {
  document.body.classList.add("with-stats");
  document.getElementById("stats").hidden = false;
  const box = document.getElementById("counts");
  const addCount = (key, label, color, cls = "") => {
    const c = document.createElement("div");
    c.className = "count " + cls;
    c.style.setProperty("--c", color);
    c.innerHTML = `<i></i>${label}<b>0</b>`;
    box.appendChild(c);
    countEls[key] = c.querySelector("b");
  };
  for (const id of ["kick", "snare", "hihat", "hhpedal", "tom1", "tom2", "tom3", "crash", "ride"]) {
    const [, label, , , , color] = PIECES.find(pc => pc[0] === id);
    addCount(id, label, color);
  }
  addCount("total", "Total", "#ffffff", "total");
  setInterval(renderStats, 100);
}

function recordHit(id) {
  if (!STATS) return;
  const now = performance.now();
  sessionStart ??= now;
  recent.push(now);
  counts[id] = (counts[id] || 0) + 1;
  countEls[id].textContent = counts[id];
  countEls.total.textContent = ++total;
}

function renderStats() {
  const now = performance.now();
  while (recent.length && now - recent[0] > APM_WINDOW_S * 1000) recent.shift();
  const apm = Math.round(recent.length * 60 / APM_WINDOW_S);
  peakApm = Math.max(peakApm, apm);
  document.getElementById("apm").textContent = apm;
  document.getElementById("peak").textContent = peakApm;
  if (sessionStart !== null) {
    const sec = Math.floor((now - sessionStart) / 1000);
    document.getElementById("clock").textContent =
      `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  }
}

function setStatus(s) {
  if (params.get("status") === "0" || params.has("demo")) return statusEl.textContent = "";
  statusEl.textContent = s.connected ? "" : "waiting for drum kit…";
}

if (params.has("demo")) {
  // 8th-note rock beat with fills, for previewing without the kit.
  const bar = [[36, 42], [42], [38, 42], [42], [36, 42], [36, 42], [38, 42], [42]];
  const fill = [[48], [48], [45], [45], [43], [43], [36, 49], [53]];
  let i = 0;
  setInterval(() => {
    const step = (Math.floor(i / 8) % 4 === 3 ? fill : bar)[i % 8];
    step.forEach(n => hit(n, 70 + Math.random() * 57));
    if (i % 16 === 0) hit(51, 90);
    if (i % 4 === 2) hit(44, 60);
    i++;
  }, 190);
} else {
  const es = new EventSource("/events");
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "hit") hit(ev.note, ev.vel);
    else if (ev.type === "status") setStatus(ev);
  };
  es.onerror = () => setStatus({ connected: false });
}
</script>
</body>
</html>
